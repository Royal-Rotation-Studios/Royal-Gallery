[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if add and not G.GAME.banned_keys[v.key] then "
position = "after"
match_indent = true
payload = '''
    -- If the selected deck or sleeve is the Exhibit one and this key is a Royal Gallery Joker
    -- add copies of it to the pool, so that it is more common to get
    local is_rlg_exhibit = 
      (G.GAME.selected_back_key or {}).key == 'b_rlg_exhibit'
      or G.GAME.selected_sleeve == 'sleeve_rlg_exhibit'

    if is_rlg_exhibit and v.key:find('j_rlg_') then
      _pool[#_pool + 1] = v.key
      _pool_size = _pool_size + 1
    end
'''
